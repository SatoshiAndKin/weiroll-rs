[package]
name = "weiroll"
version = "0.2.0"
edition = "2024"
description = "Weiroll planner for EVM using ethers-rs"
repository = "https://github.com/georgewhewell/weiroll-rs"
license = "MIT OR Apache-2.0"
include = ["**/*.rs"]

[lib]
# TODO: i don't like turning doctests off, but the bindings are all throwing errors
doctest = false

[dependencies]
alloy = "2"
bitflags = "2"
bytes = "1.12.1"
serde = "1.0.229"
slotmap = "1.1.1"
thiserror = "2.0.19"
tracing = "0.1.44"

[dev-dependencies]
alloy = {version = "2", features = ["node-bindings"]}
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
